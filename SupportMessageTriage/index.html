<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Triage Test UI</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #0f172a; color: #f8fafc; }
        textarea { width: 100%; height: 100px; padding: 10px; background: #1e293b; color: #fff; border: 1px solid #334155; border-radius: 6px; margin-bottom: 10px; }
        button { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2563eb; }
        pre { background: #1e293b; padding: 15px; border-radius: 6px; border: 1px solid #334155; overflow-x: auto; margin-top: 20px; }
    </style>
</head>
<body>
    <h2>Support Message Triage</h2>
    <p>Enter a customer support message below to test classification:</p>
    
    <textarea id="messageInput" placeholder="e.g., My credit card was charged twice!"></textarea>
    <br>
    <button onclick="triageMessage()">Classify Message</button>

    <h3>Result:</h3>
    <pre id="output">Waiting for input...</pre>

    <script>
        async function triageMessage() {
            const text = document.getElementById('messageInput').value;
            const outputElement = document.getElementById('output');
            
            if (!text.trim()) {
                outputElement.textContent = "Please enter a message.";
                return;
            }

            outputElement.textContent = "Processing...";

            try {
                const response = await fetch('http://127.0.0.1:8000/triage', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });

                const data = await response.json();
                outputElement.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                outputElement.textContent = "Error: " + error.message;
            }
        }
    </script>
</body>
</html>
